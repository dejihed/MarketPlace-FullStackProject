<div class="auth-container">
  <div class="auth-content">
    <!-- Left Side - Branding -->
    <div class="auth-branding">
      <div class="brand-logo">
        <div class="logo-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <span class="brand-text">CampusMarket</span>
      </div>
      <h1 class="brand-title">Welcome Back!</h1>
      <p class="brand-subtitle">Sign in to continue buying and selling on campus</p>
      <div class="brand-features">
        <div class="feature-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Secure transactions</span>
        </div>
        <div class="feature-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Campus-verified sellers</span>
        </div>
        <div class="feature-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Easy communication</span>
        </div>
      </div>
    </div>

    <!-- Right Side - Login Form -->
    <div class="auth-card">
      <div class="card-header">
        <h2>Sign In</h2>
        <p>Enter your credentials to access your account</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" class="auth-form">
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email Address</mat-label>
            <input matInput type="email" formControlName="email" placeholder="you@example.com">
            <mat-icon matPrefix>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </mat-icon>
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" placeholder="Enter your password">
            <mat-icon matPrefix>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </mat-icon>
          </mat-form-field>
        </div>

        <div class="form-options">
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="submit-btn"
          [disabled]="loginForm.invalid">
          Sign In
        </button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <p class="auth-switch">
        Don't have an account?
        <a routerLink="/register" class="switch-link">Create account</a>
      </p>
    </div>
  </div>
</div>
